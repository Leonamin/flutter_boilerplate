name: flutter_boilerplate
description: "Flutter Boilerplate"

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: 1.0.8
  flutter_riverpod: ^3.4.2
  go_router: ^17.3.0
  freezed_annotation: ^3.1.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: 2.15.1
  go_router_builder: ^4.4.0
  freezed: ^3.2.5

flutter:
  uses-material-design: true
  generate: true
