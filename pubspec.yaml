name: flutter_boilerplate
description: "Flutter Boilerplate"

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # State Management
  get: ^4.7.2
  go_router: ^16.2.1
  intl: ^0.20.2
  
  # Toast
  fluttertoast: ^8.2.8
  supabase_flutter: ^2.10.3
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  # 국제화 설정
  generate: true
